name: Release

# `git tag v1.4.0 && git push origin v1.4.0` is the whole release. The tag is checked against
# the package versions first, then the APK is built, signed and attached to a GitHub Release
# together with its .sha256.
#
# Only a `v*` tag can reach this workflow, and that is deliberate: the signing key lives in a
# repository secret, and a branch build has no business holding it. A fork that tags its own
# version needs to add its own secrets — without them this fails on purpose rather than
# shipping an APK nobody can install.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v1.4.0'
        required: true

permissions:
  contents: write    # create the Release and upload its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The checkout ref is left alone deliberately: `inputs` is not populated for a push event,
      # so `inputs.tag || github.ref` would resolve to nothing on the very path this workflow
      # exists for. On a tag push the event already checked out that tag, and on a manual run the
      # tag is re-checked below, from a ref that does exist.
      - uses: actions/checkout@v5

      # A tag and the packages drifting apart is the one mistake a release cannot recover
      # from — the APK would report a version its own download page disagrees with. Mirrors
      # `release:preflight` in .gitlab-ci.yml.
      #
      # Also settles on the tag, since the two ways in disagree about where it is: on a tag push
      # it is `github.ref_name`; on a manual run the branch that triggered it is checked out and
      # the tag comes from the input.
      - name: Work out the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME:-}}"
          case "$TAG" in
            v*) ;;
            *) echo "FATAL: '$TAG' is not a v* tag." >&2; exit 1 ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG."

      - name: Check the tag against the package versions
        run: |
          set -eu
          SEMVER="${TAG#v}"
          for pkg in frontend/package.json api/package.json; do
            v="$(node -p "require('./$pkg').version")"
            [ "$v" = "$SEMVER" ] || {
              echo "FATAL: $TAG but $pkg says $v — bump it (or tag the bump commit) and re-tag." >&2
              exit 1
            }
          done
          echo "VERSION=$SEMVER" >> "$GITHUB_ENV"
          echo "Tag $TAG matches frontend and api ($SEMVER)."

      # A release must never quietly ship an APK nobody can install.
      - name: Require the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          missing=''
          [ -n "${KEYSTORE_B64:-}" ]      || missing="$missing ANDROID_KEYSTORE_B64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ]         || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            {
              echo "FATAL: this is a release, but the signing secrets are not set:$missing"
              echo
              echo "Add them under Settings -> Secrets and variables -> Actions. See"
              echo "docs/RELEASING.md for how to make the keystore and encode it."
              echo
              echo "Refusing to publish an unsigned APK: it installs on nothing."
            } >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            .gradle/wrapper
            .gradle/caches
          key: gradle-${{ runner.os }}-release-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci
        working-directory: frontend

      - name: Build the mobile bundle
        working-directory: frontend
        run: |
          set -eu
          VITE_MOBILE=1 npx vite build
          node ../scripts/catalogue/stage-media.mjs dist

      # `cap sync android` rather than the `build:mobile` script: a bare `cap sync` also syncs
      # ios/, which wants CocoaPods and does not exist on a Linux runner.
      - name: Sync into the Android project
        working-directory: frontend
        run: |
          set -eu
          npx cap sync android
          node scripts/check-mobile-bundle.mjs

      # assembleRelease is its own step so a Gradle failure is distinguishable from a signing
      # failure. They were one step before, and "exit code 2" from a shell script that did five
      # things told nobody which of the five broke.
      - name: Assemble the release APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleRelease

      # Everything here reports what it was working with before it fails. The first run of this
      # workflow failed with nothing but "exit code 2" and no way to tell a corrupt secret from a
      # bad password from a missing file, which cost a round trip through the UI to diagnose.
      # A signing step should say which of those it hit.
      - name: Align and sign
        working-directory: frontend/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          echo "::group::What the secrets look like"
          echo "KEYSTORE_B64 length:   ${#KEYSTORE_B64} characters"
          echo "KEYSTORE_PASSWORD len: ${#KEYSTORE_PASSWORD} characters"
          echo "KEY_ALIAS:             '${KEY_ALIAS}'"
          echo "VERSION from GITHUB_ENV: '${VERSION:-<unset>}'"
          echo "::endgroup::"

          if [ -z "${VERSION:-}" ]; then
            echo "FATAL: VERSION is unset — the 'Check the tag' step did not run or did not export it." >&2
            exit 1
          fi

          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            echo "FATAL: $UNSIGNED was not produced by assembleRelease." >&2
            ls -la app/build/outputs/apk/release/ 2>&1 || true
            exit 1
          fi
          echo "unsigned APK: $(wc -c < "$UNSIGNED") bytes"

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools:  $BT"
          mkdir -p ../../artifacts

          # a) decode. A secret pasted through the web UI can arrive truncated, so report the
          #    length and the decoded size rather than letting `base64 -d` fail obscurely.
          echo "::group::Decoding the keystore"
          KS="$(mktemp)"
          if ! printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS" 2>&1; then
            echo "FATAL: ANDROID_KEYSTORE_B64 is not valid base64." >&2
            echo "Re-paste the secret from ~/getgoodbody-release.jks.b64 (single line)." >&2
            exit 1
          fi
          DECODED="$(wc -c < "$KS")"
          echo "decoded keystore: $DECODED bytes"
          if [ "$DECODED" -lt 1000 ]; then
            echo "FATAL: decoded keystore is only $DECODED bytes — a real PKCS#12 is ~2.7 KB." >&2
            echo "The secret is almost certainly truncated. Re-paste it in full." >&2
            exit 1
          fi
          echo "::endgroup::"

          # b) the password must be plain ASCII with no leading or trailing whitespace.
          #    This is not paranoia: copying a password file with `pbcopy < file` includes the
          #    file's trailing newline, GitHub's single-line secret field keeps it, and apksigner
          #    then fails with "failed to decrypt safe contents entry: Password is not ASCII"
          #    while loadKeyStoreFromFile has already succeeded — so the error points at the
          #    wrong thing. keytool -list does NOT catch this (it tolerates the newline), which
          #    is how a run got past a keytool-based check and failed in apksigner anyway.
          # b) the password must be plain ASCII with no leading or trailing whitespace.
          #    This is not paranoia. A password copied out of a file can carry a byte that is not
          #    printable ASCII, and apksigner then fails with "failed to decrypt safe contents
          #    entry: Password is not ASCII" *after* loadKeyStoreFromFile has already succeeded —
          #    so the error points at the keystore rather than the secret.
          #
          #    keytool -list does not catch this (it tolerates the extra byte), which is how an
          #    earlier run got past a keytool-based check and failed inside apksigner anyway. The
          #    check below reads the value through the environment, never through $( ), so nothing
          #    is silently stripped before it is inspected.
          # b) the password must be printable ASCII with no leading or trailing space.
          #
          #    Why this is not paranoia: a password copied out of a file can carry a byte that
          #    is not printable ASCII, and apksigner then reports
          #      "failed to decrypt safe contents entry: Password is not ASCII"
          #    from PKCS12KeyStore.engineLoad — i.e. *after* the keystore was read fine. The
          #    message therefore reads as a corrupt keystore, which is exactly the wrong place
          #    to look. A keytool -list check does not catch it either: keytool tolerates a
          #    stray trailing byte that apksigner refuses.
          #
          #    The value goes in through the environment and is measured by byte count, never
          #    through $( ) — command substitution strips trailing newlines before they can be
          #    seen, which is the one thing being looked for.
          echo "::group::Checking the password bytes"
          PW_BYTES="$(printf '%s' "$KEYSTORE_PASSWORD" | wc -c | tr -d ' ')"
          PW_CLEAN_BYTES="$(printf '%s' "$KEYSTORE_PASSWORD" | LC_ALL=C tr -d '\40-\176' | wc -c | tr -d ' ')"
          echo "password: $PW_BYTES bytes, of which $PW_CLEAN_BYTES are outside printable ASCII"

          if [ "$PW_CLEAN_BYTES" != "0" ]; then
            echo "FATAL: ANDROID_KEYSTORE_PASSWORD contains $PW_CLEAN_BYTES byte(s) outside ASCII 32-126." >&2
            echo "The secret as stored, byte by byte (od -c):" >&2
            printf '%s' "$KEYSTORE_PASSWORD" | LC_ALL=C od -c | head -4 | sed 's/^/  /' >&2
            echo "Decimal values of every byte:" >&2
            printf '%s' "$KEYSTORE_PASSWORD" | LC_ALL=C od -An -tu1 | tr -s ' ' | sed 's/^/  /' >&2
            echo >&2
            echo "A trailing newline or a non-breaking space picked up while copying is the usual cause." >&2
            echo "Re-paste with:  pbcopy < ~/getgoodbody-release.password.clean.txt" >&2
            exit 1
          fi
          case "$KEYSTORE_PASSWORD" in
            " "*) echo "FATAL: the password starts with a space — a stray paste." >&2; exit 1 ;;
            *" ") echo "FATAL: the password ends with a space — a stray paste." >&2; exit 1 ;;
          esac
          echo "::endgroup::"

          # c) prove the password and alias open the keystore, using keytool from the same JDK
          #    Gradle ran under. Kept after the byte check, not instead of it: keytool says
          #    whether the password is *right*, the byte check says whether it is *shaped right*,
          #    and apksigner only accepts both.
          echo "::group::Checking the password and alias"
          if ! "$JAVA_HOME/bin/keytool" -J-Duser.language=en -list -keystore "$KS" \
                 -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "FATAL: the keystore did not open with ANDROID_KEYSTORE_PASSWORD + alias '$KEY_ALIAS'." >&2
            echo "Either the password secret is wrong, or the alias does not exist in the keystore." >&2
            echo "Aliases actually present:" >&2
            "$JAVA_HOME/bin/keytool" -J-Duser.language=en -list -keystore "$KS" \
              -storepass:env KEYSTORE_PASSWORD 2>&1 | sed 's/^/  /' >&2 || echo "  (the password did not open it either)" >&2
            exit 1
          fi
          echo "keystore opens with the alias '$KEY_ALIAS'"
          echo "::endgroup::"

          echo "::group::Signing"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEYSTORE_PASSWORD" \
            --out "../../artifacts/GetGoodBody-$VERSION.apk" aligned.apk
          rm -f "$KS" aligned.apk
          echo "::endgroup::"

          echo "::group::Verifying the signature"
          "$BT/apksigner" verify --print-certs "../../artifacts/GetGoodBody-$VERSION.apk"
          echo "::endgroup::"

          cd ../../artifacts
          sha256sum "GetGoodBody-$VERSION.apk" > "GetGoodBody-$VERSION.apk.sha256"
          cat "GetGoodBody-$VERSION.apk.sha256"

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # TAG comes from the "Work out the tag" step through GITHUB_ENV. It is not re-derived
          # here: `inputs` is empty on a tag push, which is the normal path.
          gh release create "$TAG" \
            --title "GetGoodBody $VERSION" \
            --generate-notes \
            artifacts/GetGoodBody-"$VERSION".apk \
            artifacts/GetGoodBody-"$VERSION".apk.sha256 \
            artifacts/GetGoodBody-"$VERSION".apk.idsig
